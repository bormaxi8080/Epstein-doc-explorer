[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epstein-explorer-ingestion"
version = "1.1.0"
description = "Provenance-preserving DOJ ingestion for Epstein Document Explorer"
requires-python = ">=3.10"
dependencies = ["ijson>=3.3,<4", "jsonschema>=4.23,<5", "pypdf>=5,<7", "certifi>=2024.8.30", "pypdfium2==5.15.2", "Pillow==12.3.0"]

[project.optional-dependencies]
dev = ["ruff==0.17.3"]

[project.scripts]
explorer-ingest = "explorer_ingest.cli:main"
explorer-download = "explorer_ingest.archive_cli:main"
explorer-data = "explorer_ingest.distribution_cli:main"
explorer-corpus = "explorer_ingest.corpus_cli:main"

[tool.setuptools.packages.find]
where = ["ingestion"]
include = ["explorer_ingest*"]

[tool.setuptools.package-data]
explorer_ingest = ["*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
