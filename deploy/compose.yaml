services:
  explorer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: https://${EXPLORER_DOMAIN:?Set EXPLORER_DOMAIN}
    volumes:
      - ${EXPLORER_DATA_DIR:?Set EXPLORER_DATA_DIR}:/data:ro
    expose:
      - '3001'
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      EXPLORER_DOMAIN: ${EXPLORER_DOMAIN:?Set EXPLORER_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - explorer
volumes:
  caddy_data:
  caddy_config:
